[project]
name = "build-alpha-mcp"
version = "0.1.0"
description = "Windows UI Automation for Build Alpha, a SQLite strategy cache, and an MCP server over the cache."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.0.55",
]

[tool.uv]
# Keep a wheel-backed cryptography release. Some platforms have no wheel for
# newer releases and then fall back to a Rust build.
constraint-dependencies = ["cryptography<47"]
